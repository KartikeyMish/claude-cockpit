# claude-cockpit: Ghostty profile tuned for Claude Code
#
# Installed as ~/.config/ghostty/cockpit.conf and pulled in from your main
# config with `config-file = ?cockpit.conf`, so your own settings stay yours.
# Anything you set in ~/.config/ghostty/config AFTER that line overrides this.
#
# Design goals: low RAM/GPU, zero setup for Claude Code keys and notifications,
# and fast parallel sessions (splits, tabs, a drop-down quick terminal).
# Check every key with: ghostty +validate-config

# ---- Look: readable, no expensive effects ---------------------------------
# Ghostty bundles JetBrains Mono, so no font install is needed.
font-size = 14
theme = dark:Catppuccin Mocha,light:Catppuccin Latte
window-padding-x = 12
window-padding-y = 8
window-padding-balance = true
# Opaque, no blur, no shaders: transparency and custom shaders cost GPU time.
background-opacity = 1
cursor-style = bar
cursor-style-blink = false
# Dim unfocused splits so it's obvious which Claude session you're typing into.
unfocused-split-opacity = 0.8
macos-titlebar-style = tabs

# ---- Memory ----------------------------------------------------------------
# Scrollback is allocated per surface as it fills. 10 MB (the default) holds
# long Claude transcripts; lower it if you keep many idle tabs open.
scrollback-limit = 10000000

# ---- Claude Code keys ------------------------------------------------------
# Shift+Enter (newline) works natively in Ghostty. Option-as-Alt enables
# Claude's Option shortcuts (Option+Enter newline, Option+P model picker, …).
macos-option-as-alt = true

# ---- Clipboard: Claude's /copy (OSC 52) can write; programs must ask to read --
clipboard-read = ask
clipboard-write = allow
copy-on-select = clipboard
mouse-hide-while-typing = true

# ---- Notifications ---------------------------------------------------------
# Claude Code detects Ghostty and sends a desktop notification when it
# finishes or needs permission. Bounce the dock and badge the title too.
desktop-notifications = true
bell-features = system,attention,title

# ---- Sessions survive restarts ---------------------------------------------
window-save-state = always
window-inherit-working-directory = true
# Never lose a running Claude session to a stray Cmd+W.
confirm-close-surface = true

# ---- SSH (e.g. into dev boxes): fall back gracefully if the remote lacks
# Ghostty's terminfo instead of breaking Claude's TUI.
shell-integration-features = ssh-env,ssh-terminfo

# ---- Parallel sessions -----------------------------------------------------
# Cmd+D / Cmd+Shift+D split right/down; Cmd+Opt+arrows move between splits.
keybind = cmd+d=new_split:right
keybind = cmd+shift+d=new_split:down
keybind = cmd+alt+left=goto_split:left
keybind = cmd+alt+right=goto_split:right
keybind = cmd+alt+up=goto_split:up
keybind = cmd+alt+down=goto_split:down
# Zoom one split to full window while reviewing a big diff.
keybind = cmd+shift+enter=toggle_split_zoom
keybind = cmd+shift+e=equalize_splits

# Drop-down terminal from anywhere: Ctrl+` (macOS will ask for Accessibility
# permission the first time). Handy for a quick `ccx ls` or a one-off prompt.
keybind = global:ctrl+grave_accent=toggle_quick_terminal
quick-terminal-position = top
quick-terminal-animation-duration = 0.08
